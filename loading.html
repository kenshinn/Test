<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVERSE Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            background: #212A39;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner"></div>

    <script>
        // 根據 URL 參數獲取類型
        function getLoadingType() {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type') || 'default';
            
            // 儲存類型資訊供 Flutter 使用
            window.viverseLoadingType = type;
        }
        
        // 頁面載入完成後執行
        document.addEventListener('DOMContentLoaded', function() {
            getLoadingType();
            
            // 通知 Flutter 頁面已準備就緒
            setTimeout(() => {
                console.log('VIVERSE Loading page ready, type:', window.viverseLoadingType);
            }, 100);
        });
    </script>
</body>
</html>
