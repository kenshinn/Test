<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 3.2 Final//EN"><html>

<head>
  <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0">  
  <script type="text/javascript">
    function onLoad() {
      if(window.flutterWebview != undefined) {
        flutterWebview.onmessage = function(event) {
  // prints "Got it!" when we receive the app's response.
          alert("onmessage:" + event.data);
}
      }
      var imageUrl = "https://kenshinn.github.io/Test/20mb.mp4";
      var t1 = new Date().getTime();
      console.log("before fetch to base64 : " + t1);

      fetch(imageUrl)
          .then((response) => response.blob())
          .then(function(myBlob) {

                  var reader = new FileReader();

                  reader.onloadend = function() {
                      window.base64String = reader.result;  
                      var t2 = new Date().getTime();
                      console.log("after fetch to base64 : " + t2);
                      console.log("fetch to base64 time: " + (t2-t1));

                      
                  }
                  reader.readAsDataURL(myBlob);                
          });
    }
    
    function test() {
      if(window.flutterWebview != undefined) {
        flutterWebview.postMessage("haha");
      }
    }
    
    function test2() {
      if(window.flutterWebview != undefined) {
        var imageUrl = "https://kenshinn.github.io/Test/cast01.png";
        fetch(imageUrl)
  .then((response) => response.blob())
  .then((myBlob) => {
    flutterWebview.postMessage({feature:'blob', data:myBlob});    
  });        
      }      
    }
    
function test3() {
      if(window.flutterWebview != undefined) {
        var imageUrl = "https://kenshinn.github.io/Test/cast01.png";
        fetch(imageUrl)
  .then((response) => response.blob())
  .then((myBlob) => {
      var url = URL.createObjectURL(myBlob);
    flutterWebview.postMessage(JSON.stringify({feature:'blob', data:url}));    
  });    
      }
}
